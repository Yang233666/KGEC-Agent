name: public-release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validated demo and test dependencies
        run: |
          python -m pip install -r requirements-demo.txt
          python -m pip install --no-deps .
          python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Run public-release tests with network-blocked replay tests
        run: python -m pytest -p no:cacheprovider tests/public_release
      - name: Replay all canonical scenarios
        run: |
          python -m kgec_agent.demo replay --scenario canonical_accept --output-dir "${RUNNER_TEMP}/canonical_accept"
          python -m kgec_agent.demo replay --scenario canonical_verify_review --output-dir "${RUNNER_TEMP}/canonical_verify_review"
          python -m kgec_agent.demo replay --scenario canonical_reject_abstain --output-dir "${RUNNER_TEMP}/canonical_reject_abstain"
      - name: Validate manifest, checksums, paths, secrets, and denied files
        run: python scripts/validate_public_release.py
