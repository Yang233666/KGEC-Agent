[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kgec-agent"
version = "1.0.0"
description = "Calibration-guided agent and offline reviewer demo for trustworthy knowledge graph completion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Yang Yang"},
  {name = "Yinan Liu"},
  {name = "Edward Curry"},
]
keywords = ["knowledge graphs", "link prediction", "calibration", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.8,<3",
  "rdflib>=7,<8",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
dev = [
  "pytest>=8,<10",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/Yang233666/KGEC-Agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kgec_agent.demo" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/public_release"]
addopts = "-q"
